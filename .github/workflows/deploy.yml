name: Publicar AFACES en TINET (FTPS)
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Reparar publicación subiendo todos los archivos'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tinet-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.TINET_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: tinet-production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER || 'usuaris.tinet.cat' }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      TINET_REMOTE_DIR: 'auto'
      TINET_FORCE_FULL_DEPLOY: ${{ inputs.force_full || 'false' }}
      TINET_FTP_PORT: ${{ vars.TINET_FTP_PORT || '21' }}
      TINET_PUBLIC_URL: ${{ vars.TINET_PUBLIC_URL || 'https://usuaris.tinet.cat/~afaces/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas, integridad y paquete público
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node --check js/mobile-nav.js
          node --test tests/*.test.cjs
          python scripts/sync_catalog.py --check
          python scripts/build_tinet.py --manifest
      # TINET entrega solo el certificado de servidor (sin OV R36 intermedio).
      # Nunca se usa el PEM del repositorio: se obtiene de Sectigo durante el job.
      # La descarga se verifica con SHA-256 DER fijado y no altera el trust store.
      - name: Obtener intermedio Sectigo verificado (solo RUNNER_TEMP)
        run: |
          set -euo pipefail
          python -m scripts.fetch_tinet_intermediate --output "$RUNNER_TEMP/sectigo_intermediate.pem"
          echo "TINET_INTERMEDIATE_PEM=$RUNNER_TEMP/sectigo_intermediate.pem" >> "$GITHUB_ENV"
      - name: Comprobar cadena y hostname FTPS con OpenSSL (sin credenciales)
        run: |
          set -euo pipefail
          if ! timeout 40s openssl s_client -starttls ftp \
              -connect "$FTP_SERVER:$TINET_FTP_PORT" -servername "$FTP_SERVER" \
              -verify_hostname "$FTP_SERVER" -verify_return_error \
              -CAfile "$TINET_INTERMEDIATE_PEM" -CApath /etc/ssl/certs \
              -brief </dev/null >"$RUNNER_TEMP/tinet-tls.log" 2>&1; then
            cat "$RUNNER_TEMP/tinet-tls.log"
            exit 1
          fi
          grep -q 'Verification: OK' "$RUNNER_TEMP/tinet-tls.log"
          echo "OK: OpenSSL verificó la cadena FTPS y el nombre del servidor"
      - name: Publicar por FTPS explícito en raíz web detectada con welcome.html
        run: |
          if [ "$TINET_FORCE_FULL_DEPLOY" = "true" ]; then
            python scripts/deploy_tinet.py --dist dist --backup "$RUNNER_TEMP/tinet-backup" --force
          else
            python scripts/deploy_tinet.py --dist dist --backup "$RUNNER_TEMP/tinet-backup"
          fi
      - name: Guardar copias de seguridad de archivos sobrescritos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinet-backup-${{ github.run_number }}
          path: ${{ runner.temp }}/tinet-backup/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verificar páginas y catálogo en TINET mediante SHA-256
        run: |
          python scripts/verify_tinet.py --base-url "$TINET_PUBLIC_URL" --manifest dist/deploy-manifest.json --retries 4
