name: Capturar snapshot de YouTube (sin alterar catálogo)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar extractor
        run: python -m pip install 'yt-dlp>=2025.1.1'
      - name: Extraer metadatos de YouTube en un fichero aislado
        run: python scripts/fetch_youtube.py --output "$RUNNER_TEMP/youtube-snapshot.json"
      - name: Conservar snapshot para revisión o conciliación
        uses: actions/upload-artifact@v4
        with:
          name: afaces-youtube-snapshot
          path: ${{ runner.temp }}/youtube-snapshot.json
          if-no-files-found: error
          retention-days: 14
