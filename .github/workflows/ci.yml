name: Validar web AFACES
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnosticar cadena TLS de TINET sin credenciales
        run: |
          set +e
          echo "=== OPENSSL S_CLIENT ==="
          timeout 20 openssl s_client -starttls ftp -connect usuaris.tinet.cat:21 -servername usuaris.tinet.cat -showcerts </dev/null > "$RUNNER_TEMP/ftps-tls.txt" 2>&1
          grep -E 'subject=|issuer=|Verify return code|verify error|Certificate chain| s:| i:|notBefore|notAfter' "$RUNNER_TEMP/ftps-tls.txt" | head -35
          echo "=== LEAF DETAILS ==="
          timeout 20 openssl s_client -starttls ftp -connect usuaris.tinet.cat:21 -servername usuaris.tinet.cat </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext authorityInfoAccess -ext subjectAltName
          echo "=== END DIAGNOSTIC ==="
      - name: Encontrar certificado intermedio y probar FTPS con validación estricta
        run: |
          set +e
          for URL in \
            'http://crt.sectigo.com/SectigoPublicServerAuthenticationCAOVR36.crt' \
            'https://sectigo.tbs-certificats.com/SectigoPublicServerAuthenticationCAOVR36.crt' \
            'https://crt.sh/?d=4267304698'; do
            echo "CA_SOURCE: $URL"
            curl --fail --location --silent --show-error --max-time 12 "$URL" -o "$RUNNER_TEMP/sectigo.crt"
            if [ $? -eq 0 ]; then
              openssl x509 -inform DER -in "$RUNNER_TEMP/sectigo.crt" -out "$RUNNER_TEMP/sectigo.pem" 2>/dev/null ||
                openssl x509 -inform PEM -in "$RUNNER_TEMP/sectigo.crt" -out "$RUNNER_TEMP/sectigo.pem" 2>/dev/null
              openssl x509 -in "$RUNNER_TEMP/sectigo.pem" -noout -subject -issuer -fingerprint -sha256
              cat "$RUNNER_TEMP/sectigo.pem"
              echo 'VERIFY WITH SECTIGO ISSUER'
              python - <<'PY'
          import os, ssl
          from ftplib import FTP_TLS
          ctx = ssl.create_default_context()
          ctx.load_verify_locations(cafile=os.environ['RUNNER_TEMP']+'/sectigo.pem')
          with FTP_TLS(context=ctx, timeout=12) as ftp:
              ftp.connect('usuaris.tinet.cat',21)
              ftp.auth()
              print('TLS_STRICT_SUCCESS', ftp.sock.version())
          PY
              break
            fi
          done
      - name: Preparar worktree de verificación aislado
        run: git worktree add --detach "$RUNNER_TEMP/afaces-web-verify" HEAD
      - name: Pruebas, sincronización y construcción
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/afaces-web-verify"
          for file in js/*.js; do node --check "$file"; done
          python -m unittest discover -s tests -v
          python scripts/sync_catalog.py --check
          python scripts/build_tinet.py --manifest
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/afaces-http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python scripts/verify_tinet.py --base-url http://127.0.0.1:8765/ --all --retries 3
      - name: Publicar artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: afaces-tinet-site
          path: ${{ runner.temp }}/afaces-web-verify/dist/
          if-no-files-found: error
      - name: Limpiar worktree temporal
        if: always()
        run: |
          git worktree remove --force "$RUNNER_TEMP/afaces-web-verify" || true
          git worktree prune
