name: 🚀 Deploy to FTP

on:
  push:
    branches: [ main, master ] # Cambia "main" o "master" por la rama principal de tu proyecto si se llama diferente

jobs:
  web-deploy:
    name: 📥 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: SYNC to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # server-dir: /public_html/ # (Opcional) Descomenta y cambia esto si tus archivos van en una subcarpeta específica del servidor
