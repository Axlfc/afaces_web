name: Validar web AFACES
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar el contexto FTPS empaquetado contra TINET sin credenciales
        run: |
          python - <<'PY'
          from ftplib import FTP_TLS
          from scripts.deploy_tinet import make_ftps_context
          with FTP_TLS(context=make_ftps_context(), timeout=20) as ftp:
              ftp.connect('usuaris.tinet.cat', 21)
              ftp.auth()
              print('FTPS_BUNDLED_CERT_VERIFIED', ftp.sock.version())
          PY
      - name: Preparar worktree de verificación aislado
        run: git worktree add --detach "$RUNNER_TEMP/afaces-web-verify" HEAD
      - name: Pruebas, sincronización y construcción
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/afaces-web-verify"
          for file in js/*.js; do node --check "$file"; done
          python -m unittest discover -s tests -v
          python scripts/sync_catalog.py --check
          python scripts/build_tinet.py --manifest
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/afaces-http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python scripts/verify_tinet.py --base-url http://127.0.0.1:8765/ --all --retries 3
      - name: Publicar artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: afaces-tinet-site
          path: ${{ runner.temp }}/afaces-web-verify/dist/
          if-no-files-found: error
      - name: Limpiar worktree temporal
        if: always()
        run: |
          git worktree remove --force "$RUNNER_TEMP/afaces-web-verify" || true
          git worktree prune
