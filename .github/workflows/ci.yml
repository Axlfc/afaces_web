name: Validar web AFACES
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar worktree de verificación aislado
        run: git worktree add --detach "$RUNNER_TEMP/afaces-web-verify" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas, sincronización y construcción
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/afaces-web-verify"
          for file in js/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -v
          python scripts/sync_catalog.py --check
          python scripts/build_tinet.py --manifest
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/afaces-http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python scripts/verify_tinet.py --base-url http://127.0.0.1:8765/ --all --retries 3
      # Smoke real sin secretos: comprueba si TINET sigue omitiendo el intermedio
      # o cambia su cadena; nunca desactiva la verificación TLS.
      - name: Validar cadena FTPS TINET con OpenSSL sin credenciales
        run: |
          set -euo pipefail
          python -m scripts.fetch_tinet_intermediate --output "$RUNNER_TEMP/sectigo_intermediate.pem"
          if ! timeout 40s openssl s_client -starttls ftp \
              -connect usuaris.tinet.cat:21 -servername usuaris.tinet.cat \
              -verify_hostname usuaris.tinet.cat -verify_return_error \
              -CAfile "$RUNNER_TEMP/sectigo_intermediate.pem" -CApath /etc/ssl/certs \
              -brief </dev/null >"$RUNNER_TEMP/tinet-ci-tls.log" 2>&1; then
            cat "$RUNNER_TEMP/tinet-ci-tls.log"
            exit 1
          fi
          grep -q 'Verification: OK' "$RUNNER_TEMP/tinet-ci-tls.log"
          echo "OK: cadena y hostname TINET verificados"
      - name: Publicar artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: afaces-tinet-site
          path: ${{ runner.temp }}/afaces-web-verify/dist/
          if-no-files-found: error
      - name: Limpiar worktree temporal
        if: always()
        run: |
          git worktree remove --force "$RUNNER_TEMP/afaces-web-verify" || true
          git worktree prune
